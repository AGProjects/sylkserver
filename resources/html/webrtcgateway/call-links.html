<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Temporary call links</title>
<style>
:root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e6; --accent: #0a66d8; --danger: #c62828; --row: #f7f7f9; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1c1c1e; --fg: #f2f2f7; --muted: #a1a1a6; --line: #3a3a3c; --accent: #4c9aff; --danger: #ff6b6b; --row: #242426; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
form.add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
input[type=text], input[type=password] { flex: 1 1 240px; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--row); color: var(--fg); font: inherit; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.name input { width: 100%; }
td.link code { font-size: 13px; word-break: break-all; }
td.actions { white-space: nowrap; text-align: right; }
tr.expired td { color: var(--muted); }
.meta { color: var(--muted); font-size: 12px; }
#status { min-height: 1.4em; margin: 12px 0; color: var(--muted); }
#status.error { color: var(--danger); }
@media (max-width: 680px) {
  thead { display: none; }
  tr { display: block; border-bottom: 1px solid var(--line); padding: 6px 0; }
  td { display: block; border: 0; padding: 4px 0; }
  td.actions { text-align: left; }
}
</style>
</head>
<body>
<main>
  <h1>Temporary call links</h1>
  <p class="sub"><span id="account"></span> <button type="button" id="logout" hidden>Sign out</button></p>
  <form class="add" id="login" hidden>
    <input type="text" id="login-account" placeholder="SIP account (user@domain)" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <form class="add" id="add">
    <input type="text" id="new-name" maxlength="100" placeholder="Who the link is for" required>
    <select id="new-validity" aria-label="Valid for"></select>
    <button class="primary" type="submit">Create link</button>
  </form>
  <div id="status"></div>
  <table id="links" hidden>
    <thead><tr><th style="width:30%">Name</th><th style="width:22%">Valid until</th><th>Link</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<script>
(function () {
  'use strict';
  var DAY = 86400000;
  var LINK_DOMAIN = 'anonymous.invalid';
  var VALIDITY = [['1 hour', DAY / 24], ['1 day', DAY], ['3 days', 3 * DAY], ['1 week', 7 * DAY], ['1 month', 30 * DAY], ['3 months', 91 * DAY], ['1 year', 365 * DAY]];
  var session = {};

  function store(key, value) { try { sessionStorage.setItem(key, value); } catch (e) {} }
  function forget(key) { try { sessionStorage.removeItem(key); } catch (e) {} }

  // MD5 of a UTF-8 string, hex: the HA1 of the SIP credentials is all the server gets
  function md5(text) {
    function add(x, y) { var l = (x & 0xffff) + (y & 0xffff); return (((x >> 16) + (y >> 16) + (l >> 16)) << 16) | (l & 0xffff); }
    function rol(n, c) { return (n << c) | (n >>> (32 - c)); }
    function cmn(q, a, b, x, s, t) { return add(rol(add(add(a, q), add(x, t)), s), b); }
    function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
    function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
    function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
    function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
    var bytes = unescape(encodeURIComponent(text)), n = bytes.length, words = [], i;
    for (i = 0; i < n; i++) { words[i >> 2] |= bytes.charCodeAt(i) << ((i % 4) * 8); }
    words[n >> 2] |= 0x80 << ((n % 4) * 8);
    words[(((n + 8) >> 6) + 1) * 16 - 2] = n * 8;
    for (i = 0; i < words.length; i++) { words[i] = words[i] | 0; }
    var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
    for (i = 0; i < words.length; i += 16) {
      var oa = a, ob = b, oc = c, od = d, x = words.slice(i, i + 16).map(function (w) { return w | 0; });
      a = ff(a, b, c, d, x[0], 7, -680876936); d = ff(d, a, b, c, x[1], 12, -389564586); c = ff(c, d, a, b, x[2], 17, 606105819); b = ff(b, c, d, a, x[3], 22, -1044525330);
      a = ff(a, b, c, d, x[4], 7, -176418897); d = ff(d, a, b, c, x[5], 12, 1200080426); c = ff(c, d, a, b, x[6], 17, -1473231341); b = ff(b, c, d, a, x[7], 22, -45705983);
      a = ff(a, b, c, d, x[8], 7, 1770035416); d = ff(d, a, b, c, x[9], 12, -1958414417); c = ff(c, d, a, b, x[10], 17, -42063); b = ff(b, c, d, a, x[11], 22, -1990404162);
      a = ff(a, b, c, d, x[12], 7, 1804603682); d = ff(d, a, b, c, x[13], 12, -40341101); c = ff(c, d, a, b, x[14], 17, -1502002290); b = ff(b, c, d, a, x[15], 22, 1236535329);
      a = gg(a, b, c, d, x[1], 5, -165796510); d = gg(d, a, b, c, x[6], 9, -1069501632); c = gg(c, d, a, b, x[11], 14, 643717713); b = gg(b, c, d, a, x[0], 20, -373897302);
      a = gg(a, b, c, d, x[5], 5, -701558691); d = gg(d, a, b, c, x[10], 9, 38016083); c = gg(c, d, a, b, x[15], 14, -660478335); b = gg(b, c, d, a, x[4], 20, -405537848);
      a = gg(a, b, c, d, x[9], 5, 568446438); d = gg(d, a, b, c, x[14], 9, -1019803690); c = gg(c, d, a, b, x[3], 14, -187363961); b = gg(b, c, d, a, x[8], 20, 1163531501);
      a = gg(a, b, c, d, x[13], 5, -1444681467); d = gg(d, a, b, c, x[2], 9, -51403784); c = gg(c, d, a, b, x[7], 14, 1735328473); b = gg(b, c, d, a, x[12], 20, -1926607734);
      a = hh(a, b, c, d, x[5], 4, -378558); d = hh(d, a, b, c, x[8], 11, -2022574463); c = hh(c, d, a, b, x[11], 16, 1839030562); b = hh(b, c, d, a, x[14], 23, -35309556);
      a = hh(a, b, c, d, x[1], 4, -1530992060); d = hh(d, a, b, c, x[4], 11, 1272893353); c = hh(c, d, a, b, x[7], 16, -155497632); b = hh(b, c, d, a, x[10], 23, -1094730640);
      a = hh(a, b, c, d, x[13], 4, 681279174); d = hh(d, a, b, c, x[0], 11, -358537222); c = hh(c, d, a, b, x[3], 16, -722521979); b = hh(b, c, d, a, x[6], 23, 76029189);
      a = hh(a, b, c, d, x[9], 4, -640364487); d = hh(d, a, b, c, x[12], 11, -421815835); c = hh(c, d, a, b, x[15], 16, 530742520); b = hh(b, c, d, a, x[2], 23, -995338651);
      a = ii(a, b, c, d, x[0], 6, -198630844); d = ii(d, a, b, c, x[7], 10, 1126891415); c = ii(c, d, a, b, x[14], 15, -1416354905); b = ii(b, c, d, a, x[5], 21, -57434055);
      a = ii(a, b, c, d, x[12], 6, 1700485571); d = ii(d, a, b, c, x[3], 10, -1894986606); c = ii(c, d, a, b, x[10], 15, -1051523); b = ii(b, c, d, a, x[1], 21, -2054922799);
      a = ii(a, b, c, d, x[8], 6, 1873313359); d = ii(d, a, b, c, x[15], 10, -30611744); c = ii(c, d, a, b, x[6], 15, -1560198380); b = ii(b, c, d, a, x[13], 21, 1309151649);
      a = ii(a, b, c, d, x[4], 6, -145523070); d = ii(d, a, b, c, x[11], 10, -1120210379); c = ii(c, d, a, b, x[2], 15, 718787259); b = ii(b, c, d, a, x[9], 21, -343485551);
      a = add(a, oa); b = add(b, ob); c = add(c, oc); d = add(d, od);
    }
    return [a, b, c, d].map(function (w) {
      var hex = '';
      for (var j = 0; j < 4; j++) { hex += ('0' + ((w >>> (j * 8)) & 0xff).toString(16)).slice(-2); }
      return hex;
    }).join('');
  }
  function load(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }

  (function () {
    var params = new URLSearchParams(location.hash.replace(/^#/, ''));
    ['account', 'token', 'base'].forEach(function (key) {
      var value = params.get(key);
      if (value) { store('call-links-' + key, value); }
      session[key] = value || load('call-links-' + key) || '';
    });
    if (location.hash) { history.replaceState(null, '', location.pathname); }
  })();

  var tbody = document.querySelector('#links tbody');
  var statusLine = document.getElementById('status');

  function status(text, error) {
    statusLine.textContent = text || '';
    statusLine.className = error ? 'error' : '';
  }

  function linkUrl(link) {
    var base = (session.base || location.origin).replace(/\/+$/, '');
    return base + '/call/' + link.token + '@' + LINK_DOMAIN;
  }

  function when(ms) {
    return new Date(ms).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  }

  function api(method, path, body) {
    var options = { method: method, headers: { 'Authorization': 'Apikey ' + session.token } };
    if (body !== undefined) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    return fetch('call-links/' + encodeURIComponent(session.account) + (path ? '/' + path : ''), options).then(function (response) {
      if (response.status === 204) { return null; }
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (response.status === 401) {
          var denied = new Error('Your session has expired. Sign in again.');
          denied.auth = true;
          throw denied;
        }
        if (!response.ok) { throw new Error(data.error || ('The server answered HTTP ' + response.status)); }
        return data;
      });
    });
  }

  function validitySelect(select, withKeep) {
    select.innerHTML = '';
    if (withKeep) { select.add(new Option('Extend…', '')); }
    VALIDITY.forEach(function (entry) { select.add(new Option(entry[0], String(entry[1]))); });
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    var area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    return Promise.resolve();
  }

  function mail(link) {
    var url = linkUrl(link);
    var body = 'You can call me with a web browser at ' + url + ' until ' + when(link.expires) + '.';
    location.href = 'mailto:?subject=' + encodeURIComponent('Call me') + '&body=' + encodeURIComponent(body);
  }

  function button(text, cls, handler) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    if (cls) { b.className = cls; }
    b.addEventListener('click', handler);
    return b;
  }

  function row(link) {
    var tr = document.createElement('tr');
    if (link.expired) { tr.className = 'expired'; }

    var nameCell = document.createElement('td');
    nameCell.className = 'name';
    var name = document.createElement('input');
    name.type = 'text';
    name.maxLength = 100;
    name.value = link.name;
    function saveName() {
      var value = name.value.trim();
      if (!value || value === link.name) { name.value = link.name; return; }
      api('PUT', link.id, { name: value }).then(function (updated) {
        link.name = updated.name;
        name.value = updated.name;
        status('Renamed to “' + updated.name + '”');
      }).catch(function (error) { name.value = link.name; status(error.message, true); });
    }
    name.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { name.blur(); }
      if (event.key === 'Escape') { name.value = link.name; name.blur(); }
    });
    name.addEventListener('blur', saveName);
    nameCell.appendChild(name);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (link.calls ? link.calls + (link.calls === 1 ? ' call' : ' calls') + ', last ' + when(link.last_call) : 'Not called yet');
    nameCell.appendChild(meta);
    tr.appendChild(nameCell);

    var expiresCell = document.createElement('td');
    var expires = document.createElement('div');
    expires.textContent = (link.expired ? 'Expired ' : '') + when(link.expires);
    expiresCell.appendChild(expires);
    var extend = document.createElement('select');
    validitySelect(extend, true);
    extend.addEventListener('change', function () {
      if (!extend.value) { return; }
      api('PUT', link.id, { expires: Date.now() + Number(extend.value) }).then(function () {
        status('Validity of “' + link.name + '” changed');
        refresh();
      }).catch(function (error) { extend.value = ''; status(error.message, true); });
    });
    expiresCell.appendChild(extend);
    tr.appendChild(expiresCell);

    var linkCell = document.createElement('td');
    linkCell.className = 'link';
    var code = document.createElement('code');
    code.textContent = linkUrl(link);
    linkCell.appendChild(code);
    tr.appendChild(linkCell);

    var actions = document.createElement('td');
    actions.className = 'actions';
    var copyButton = button('Copy', '', function () {
      copy(linkUrl(link)).then(function () { status('Link for “' + link.name + '” copied'); });
    });
    var mailButton = button('E-mail…', '', function () { mail(link); });
    copyButton.disabled = mailButton.disabled = !!link.expired;
    actions.appendChild(copyButton);
    actions.appendChild(document.createTextNode(' '));
    actions.appendChild(mailButton);
    actions.appendChild(document.createTextNode(' '));
    actions.appendChild(button('Remove', 'danger', function () {
      if (!confirm('Remove the link for “' + link.name + '”? It can no longer be called.')) { return; }
      api('DELETE', link.id).then(function () {
        status('Link for “' + link.name + '” removed');
        refresh();
      }).catch(function (error) { status(error.message, true); });
    }));
    tr.appendChild(actions);
    return tr;
  }

  function show(links) {
    tbody.innerHTML = '';
    links.forEach(function (link) { tbody.appendChild(row(link)); });
    document.getElementById('links').hidden = !links.length;
  }

  function refresh() {
    return api('GET').then(function (data) {
      show(data.links || []);
      if (!(data.links || []).length) { status('No links yet. Create one and send it to whom you want to be able to call you.'); }
    }).catch(function (error) {
      if (error.auth) { showLogin(error.message); } else { status(error.message, true); }
    });
  }

  validitySelect(document.getElementById('new-validity'), false);
  document.getElementById('new-validity').value = String(3 * DAY);

  document.getElementById('add').addEventListener('submit', function (event) {
    event.preventDefault();
    var input = document.getElementById('new-name');
    var name = input.value.trim();
    if (!name) { return; }
    var validFor = Number(document.getElementById('new-validity').value);
    api('POST', '', { name: name, expires: Date.now() + validFor }).then(function (link) {
      input.value = '';
      return refresh().then(function () {
        return copy(linkUrl(link)).then(function () { status('Link for “' + link.name + '” created and copied'); },
                                        function () { status('Link for “' + link.name + '” created'); });
      });
    }).catch(function (error) { status(error.message, true); });
  });

  function showLogin(message) {
    session.token = '';
    forget('call-links-token');
    document.getElementById('add').hidden = true;
    document.getElementById('links').hidden = true;
    document.getElementById('logout').hidden = true;
    document.getElementById('login').hidden = false;
    document.getElementById('account').textContent = 'Sign in with your SIP account to manage the links that call it without showing its address to the caller.';
    document.getElementById('login-account').value = session.account || '';
    document.getElementById((session.account ? 'login-password' : 'login-account')).focus();
    status(message || '', !!message);
  }

  function showManager() {
    document.getElementById('login').hidden = true;
    document.getElementById('add').hidden = false;
    document.getElementById('logout').hidden = false;
    document.getElementById('account').textContent = 'Links that call ' + session.account + ' without showing the address to the caller.';
    status('');
    refresh();
  }

  document.getElementById('login').addEventListener('submit', function (event) {
    event.preventDefault();
    var account = document.getElementById('login-account').value.trim().toLowerCase().replace(/^sips?:/, '');
    var password = document.getElementById('login-password');
    var parts = account.split('@');
    if (parts.length !== 2 || !parts[0] || !parts[1]) { status('The account is user@domain', true); return; }
    var button = this.querySelector('button');
    button.disabled = true;
    status('Signing in…');
    fetch('call-links/' + encodeURIComponent(account) + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ha1: md5(parts[0] + ':' + parts[1] + ':' + password.value) })
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok || !data.token) {
          throw new Error(response.status === 401 ? 'Wrong account or password' : (data.error || ('The server answered HTTP ' + response.status)));
        }
        return data;
      });
    }).then(function (data) {
      password.value = '';
      session.account = data.account || account;
      session.token = data.token;
      store('call-links-account', session.account);
      store('call-links-token', session.token);
      if (!session.base && data.base) { session.base = data.base; store('call-links-base', data.base); }
      showManager();
    }).catch(function (error) {
      status(error.message, true);
    }).then(function () { button.disabled = false; });
  });

  document.getElementById('logout').addEventListener('click', function () {
    showLogin('');
  });

  if (session.account && session.token) {
    showManager();
  } else {
    showLogin('');
  }
})();
</script>
</body>
</html>
